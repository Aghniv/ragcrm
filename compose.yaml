services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aicrm-app
    environment:
      - 'PORT=8086'
      - 'DATABASE_URL=jdbc:postgresql://host.docker.internal:5432/aicrm'
      - 'DATABASE_USERNAME=postgres'
      - 'DATABASE_PASSWORD=root'
      - 'OLLAMA_BASE_URL=http://host.docker.internal:11434'
      - 'OLLAMA_MODEL=minimax-m3'
      - 'OLLAMA_EMBEDDING_MODEL=nomic-embed-text'
      - 'JWT_SECRET=${JWT_SECRET:SUjXMugbHnPz2bAhFlXP1aFustp6DyJEIonwLfgOWYW}'
      - 'CORS_ORIGINS=http://localhost:3000,http://localhost'
    ports:
      - '8086:8086'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: aicrm-frontend
    depends_on:
      - app
    ports:
      - '3000:80'
