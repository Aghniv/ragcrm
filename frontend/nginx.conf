server {
    listen 80;
    server_name _;

    # SPA fallback — any unknown path serves index.html so React Router can handle it
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to the backend service. In docker-compose, "app" is the service name.
    location /api/ {
        proxy_pass http://app:8086;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Id       $http_x_tenant_id;
        proxy_read_timeout 90s;
    }

    location /actuator/ {
        proxy_pass http://app:8086;
        proxy_set_header Host $host;
    }

    # Don't cache the SPA shell
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
