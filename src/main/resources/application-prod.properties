# Production overrides — keep this file lean and never put secrets here.
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Be strict on what the actuator exposes
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.project.aicrm=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [tenant=%X{tenantId:-none}] %logger{36} - %msg%n
