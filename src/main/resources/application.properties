spring.application.name=aicrm
server.port=${PORT:8086}

# Spring AI
spring.ai.ollama.chat.model=${OLLAMA_MODEL:minimax-m3}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.vectorstore.pgvector.initialize-schema=${INITIALIZE_SCHEMA:true}
spring.ai.vectorstore.pgvector.dimensions=${VECTOR_DIMENSIONS:768}

# Database - Use environment variables for production
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://dpg-d9pdmu6417fc73dmj6qg-a.oregon-postgres.render.com:5432/rag_gjn7}
spring.datasource.username=${DATABASE_USERNAME:rag_gjn7_user}
spring.datasource.password=${DATABASE_PASSWORD:cKNexLQ7vKKWIs4jkkI2MKd5DqmjsWPk}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Gmail SMTP - Use environment variables for security
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT Secret - REQUIRED in production. Dev fallback is used by JwtUtil if this is empty.
# Generate with:  openssl rand -hex 32   (bash)  or
#                 -join ((1..64 | ForEach-Object { '{0:x2}' -f (Get-Random -Max 256) }))  (PowerShell)
# You can also drop a `.env` file at the project root and reference values from it via
# spring.config.import — see `.env.example`.
jwt.secret=${JWT_SECRET:}

# Spring config — additionally load a project-root .env if present.
spring.config.import=optional:file:.env[.properties]

# Application email (from-address for all outbound mail)
app.mail.from=${APP_MAIL_FROM:noreply@aicrm.local}
app.mail.reply-to=${APP_MAIL_REPLY_TO:support@aicrm.local}

# Demo workspace seeder — set APP_DEMO_ENABLED=false in production to skip.
app.demo.enabled=${APP_DEMO_ENABLED:true}

# CORS - Configure for frontend URL (comma-separated)
cors.origins=${CORS_ORIGINS:http://localhost:3000}