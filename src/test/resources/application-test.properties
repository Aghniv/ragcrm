# Test profile — uses an in-memory H2 by default but skips PG-only features.
# Real integration tests should use Testcontainers with the prod profile.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.ai.ollama.chat.model=llama3.2
spring.ai.vectorstore.pgvector.initialize-schema=false
# Provide a 32+ byte secret so JwtUtil.init() doesn't refuse to start.
jwt.secret=test-secret-that-is-long-enough-for-hs256-validation-32b
app.mail.from=test@aicrm.local